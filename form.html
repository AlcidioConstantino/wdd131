<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Share your experience with a product by submitting a product review.">
    <meta name="author" content="Alcidio Massanganhe">
    <title>Product Review | WDD 131</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
    <script src="scripts/getdates.js" defer></script>
</head>
<body>
    <header class="site-header">
        <h1>Product Review</h1>
        <p>Your feedback helps others choose the right product.</p>
    </header>

    <main>
        <form method="get" action="review.html">
            <label for="productName">Product Name <span class="required">*</span></label>
            <select id="productName" name="productName" required>
                <option value="" disabled selected>Select a Product...</option>
            </select>

            <fieldset class="rating">
                <legend>Overall Rating <span class="required">*</span></legend>
                <div class="rating-options">
                    <label for="rating1"><input type="radio" id="rating1" name="rating" value="1" required> <span aria-hidden="true">☆</span><span class="visually-hidden">1 star</span></label>
                    <label for="rating2"><input type="radio" id="rating2" name="rating" value="2" required> <span aria-hidden="true">☆☆</span><span class="visually-hidden">2 stars</span></label>
                    <label for="rating3"><input type="radio" id="rating3" name="rating" value="3" required> <span aria-hidden="true">☆☆☆</span><span class="visually-hidden">3 stars</span></label>
                    <label for="rating4"><input type="radio" id="rating4" name="rating" value="4" required> <span aria-hidden="true">☆☆☆☆</span><span class="visually-hidden">4 stars</span></label>
                    <label for="rating5"><input type="radio" id="rating5" name="rating" value="5" required> <span aria-hidden="true">☆☆☆☆☆</span><span class="visually-hidden">5 stars</span></label>
                </div>
            </fieldset>

            <label for="installDate">Date of Installation <span class="required">*</span></label>
            <input type="date" id="installDate" name="installDate" required>

            <fieldset>
                <legend>Which features did you find useful?</legend>
                <label class="choice" for="durability"><input type="checkbox" id="durability" name="usefulFeatures" value="Durability"> Durability</label>
                <label class="choice" for="easeOfUse"><input type="checkbox" id="easeOfUse" name="usefulFeatures" value="Ease of use"> Ease of use</label>
                <label class="choice" for="performance"><input type="checkbox" id="performance" name="usefulFeatures" value="Performance"> Performance</label>
                <label class="choice" for="design"><input type="checkbox" id="design" name="usefulFeatures" value="Design"> Design</label>
            </fieldset>

            <label for="writtenReview">Written Review <span class="optional">(optional)</span></label>
            <textarea id="writtenReview" name="writtenReview" rows="5"></textarea>

            <label for="userName">Your Name <span class="optional">(optional)</span></label>
            <input type="text" id="userName" name="userName" autocomplete="name">

            <input class="submit-button" type="submit" value="Submit Review">
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Alcidio Massanganhe | Mozambique</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
