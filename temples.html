<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temple Album</title>
    <meta name="description" content="A responsive photo album featuring temples.">
    <meta name="author" content="Rosario Guinhane">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="temples.css">
    <link rel="stylesheet" href="temples-large.css">

    <script src="temples.js" defer></script>
</head>

<body>

    <header>
        <div class="header-content">
            <h1>Temple Album</h1>

            <button id="menu-button" aria-label="Open navigation menu">
                ☰
            </button>

            <nav id="navigation">
                <a href="#" class="active">Home</a>
                <a href="#">Old</a>
                <a href="#">New</a>
                <a href="#">Large</a>
                <a href="#">Small</a>
            </nav>
        </div>
    </header>

    <main>
        <h2>Temple Album</h2>

        <div class="temple-grid">

            <figure>
                <img src="https://churchofjesuschristtemples.org/assets/img/temples/maputo-mozambique-temple.jpg"
                     alt="Maputo Mozambique Temple"
                     loading="lazy">
                <figcaption>Maputo Mozambique Temple</figcaption>
            </figure>

            <figure>
                <img src="https://churchofjesuschristtemples.org/assets/img/temples/johannesburg-south-africa-temple.jpg"
                     alt="Johannesburg South Africa Temple"
                     loading="lazy">
                <figcaption>Johannesburg South Africa Temple</figcaption>
            </figure>

            <figure>
                <img src="https://churchofjesuschristtemples.org/assets/img/temples/salt-lake-temple.jpg"
                     alt="Salt Lake Temple"
                     loading="lazy">
                <figcaption>Salt Lake Temple</figcaption>
            </figure>

            <figure>
                <img src="https://churchofjesuschristtemples.org/assets/img/temples/rome-italy-temple.jpg"
                     alt="Rome Italy Temple"
                     loading="lazy">
                <figcaption>Rome Italy Temple</figcaption>
            </figure>

            <figure>
                <img src="https://churchofjesuschristtemples.org/assets/img/temples/accra-ghana-temple.jpg"
                     alt="Accra Ghana Temple"
                     loading="lazy">
                <figcaption>Accra Ghana Temple</figcaption>
            </figure>

            <figure>
                <img src="https://churchofjesuschristtemples.org/assets/img/temples/pretoria-south-africa-temple.jpg"
                     alt="Pretoria South Africa Temple"
                     loading="lazy">
                <figcaption>Pretoria South Africa Temple</figcaption>
            </figure>

            <figure>
                <img src="https://churchofjesuschristtemples.org/assets/img/temples/london-england-temple.jpg"
                     alt="London England Temple"
                     loading="lazy">
                <figcaption>London England Temple</figcaption>
            </figure>

            <figure>
                <img src="https://churchofjesuschristtemples.org/assets/img/temples/nairobi-kenya-temple.jpg"
                     alt="Nairobi Kenya Temple"
                     loading="lazy">
                <figcaption>Nairobi Kenya Temple</figcaption>
            </figure>

            <figure>
                <img src="https://churchofjesuschristtemples.org/assets/img/temples/accra-ghana-temple.jpg"
                     alt="Accra Ghana Temple"
                     loading="lazy">
                <figcaption>Accra Ghana Temple</figcaption>
            </figure>

        </div>
    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span> Alcidio Massanganhe | Mozambique
        </p>

        <p id="lastModified"></p>
    </footer>

</body>
</html>
