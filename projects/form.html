```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit a product review and share your experience.">
    <meta name="author" content="Alcidio Massanganhe">
    <title>Product Review Form | WDD131</title>

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <h2>Review a Product</h2>
        <p>Share your experience with a product you have used.</p>

        <form action="review.html" method="get">
            <fieldset>
                <legend>Product Information</legend>

                <label for="productName">Product Name
                    <select id="productName" name="productName" required>
                        <option value="" disabled selected>Select a Product...</option>
                    </select>
                </label>

                <label>Overall Rating</label>
                <div class="rating">
                    <label for="rating1">☆ 1
                        <input type="radio" id="rating1" name="rating" value="1" required>
                    </label>
                    <label for="rating2">☆ 2
                        <input type="radio" id="rating2" name="rating" value="2">
                    </label>
                    <label for="rating3">☆ 3
                        <input type="radio" id="rating3" name="rating" value="3">
                    </label>
                    <label for="rating4">☆ 4
                        <input type="radio" id="rating4" name="rating" value="4">
                    </label>
                    <label for="rating5">☆ 5
                        <input type="radio" id="rating5" name="rating" value="5">
                    </label>
                </div>

                <label for="installDate">Date of Installation
                    <input type="date" id="installDate" name="installDate" required>
                </label>
            </fieldset>

            <fieldset>
                <legend>Product Features</legend>
                <p>Select all the features you found useful.</p>

                <label for="durability">
                    <input type="checkbox" id="durability" name="features" value="Durability">
                    Durability
                </label>

                <label for="easeOfUse">
                    <input type="checkbox" id="easeOfUse" name="features" value="Ease of Use">
                    Ease of Use
                </label>

                <label for="performance">
                    <input type="checkbox" id="performance" name="features" value="Performance">
                    Performance
                </label>

                <label for="design">
                    <input type="checkbox" id="design" name="features" value="Design">
                    Design
                </label>
            </fieldset>

            <fieldset>
                <legend>Additional Feedback</legend>

                <label for="writtenReview">Written Review (Optional)
                    <textarea id="writtenReview" name="writtenReview" rows="5"></textarea>
                </label>

                <label for="userName">Your Name (Optional)
                    <input type="text" id="userName" name="userName" autocomplete="name">
                </label>
            </fieldset>

            <input type="submit" value="Submit Review">
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Alcidio Massanganhe | Mozambique</p>
        <p>Last Modified: <span id="lastModified"></span></p>
    </footer>
</body>
</html>
```
