<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book of Mormon - Top 10</title>

    <meta name="description" content="A Book of Mormon favorite chapters application.">
    <meta name="author" content="Rosario Guinhane">

    <link rel="stylesheet" href="bom.css">
    <script src="scripts/bom.js" defer></script>
</head>

<body>
    <main>
        <h1>Book of Mormon - Top 10</h1>

        <div class="input-area">
            <label for="favchap">Enter your favorite chapter:</label>

            <input
                type="text"
                id="favchap"
                placeholder="Alma 5"
            >

            <button type="button">Add Chapter</button>
        </div>

        <ul id="chapter-list"></ul>
    </main>
</body>
</html>
